name: Far Cry VR Automated Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

  workflow_dispatch:

jobs:
  build:
    name: Build Far Cry VR
    runs-on: windows-2022

    permissions: write-all

    env:
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python (for meson)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install meson
        run: pip install meson ninja

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.3.290.0
          cache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86

      - name: Prepare MSVC devenv
        uses: bus1/cabuild/action/msdevshell@v1
        with:
          architecture: x86

      - name: Prepare dxvk build
        working-directory: "Sources/ThirdParty/dxvk"
        shell: cmd
        run: dxvkry_setup.bat

      - name: Build dxvk
        working-directory: "Sources/ThirdParty/dxvk/build"
        run: |
          msbuild dxvk.sln -m
          meson install

      - name: Build CryGame
        working-directory: "Sources/CryGame C++/Solution1"
        run: msbuild Solution1.sln /p:Configuration=Release -m

      - name: Create installer
        working-directory: installer
        shell: cmd
        run: create_installer.bat

      - name: Move 'latest' tag to this commit
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Update Github dev release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: latest
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: "FarCry VR development build"
          files: |
            installer/farcry-vrmod*.exe

      - name: Create tagged Github release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          name: "FarCry VR release ${{ github.ref_name }}"
          files: |
            installer/farcry-vrmod*.exe
